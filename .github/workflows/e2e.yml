name: End-to-end

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright and axe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # The same MongoDB major version as compose.yaml.
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      CI: "true"
      E2E_MONGODB_URI: mongodb://127.0.0.1:27017/andhrimnir_e2e
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Only the headless Chromium shell is needed; it is the smallest download.
      - name: Install the Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps --only-shell chromium

      # The suite serves the production build, the same output users get.
      - name: Build the frontend
        working-directory: frontend
        run: npm run build

      # Playwright starts the API and the built frontend, seeds the demo
      # restaurant into the service container and runs every spec.
      - name: Run the end-to-end suite
        working-directory: frontend
        run: npm run e2e

      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
