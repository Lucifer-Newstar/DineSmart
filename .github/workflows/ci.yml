name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Monorepo quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit

      - name: Lint and check formatting
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests when configured
        working-directory: frontend
        run: npm run test --if-present

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Keep the backend checks gated so this workflow also works on the
      # prerequisite branch before backend/package.json is merged.
      - name: Install and verify backend when present
        if: ${{ hashFiles('backend/package.json') != '' }}
        run: |
          cd backend
          npm ci
          npm audit
          npm run lint
          npm run test --if-present
          npm run typecheck
          npm run build
